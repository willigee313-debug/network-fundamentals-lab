# CP-1 — 블라인드 체크포인트: L3 종합 (04·05장 범위)
# ⚠️ 학습자: 이 파일을 읽지 마시오! (고장이 적혀 있음) MISSION.md만 보고 진단할 것.

name: cp1

mgmt:
  network: clab-mgmt
  ipv4-subnet: 10.99.99.0/24

topology:
  nodes:
    h1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.91.1.10/24 dev eth1
        - ip route add default via 10.91.1.1

    r1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - sysctl -w net.ipv4.ip_forward=1
        - ip link set eth1 up
        - ip addr add 10.91.1.1/24 dev eth1
        - ip link set eth2 up
        - ip addr add 10.91.0.1/30 dev eth2
        - ip route add 10.91.2.0/24 via 10.91.0.2
        - ip route add blackhole 10.91.2.10/32          # 고장 ①

    r2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - sysctl -w net.ipv4.ip_forward=1
        - ip link set eth1 up
        - ip addr add 10.91.0.2/30 dev eth1
        - ip link set eth2 up
        - ip addr add 10.91.2.1/24 dev eth2
        # 고장 ②: 10.91.1.0/24 리턴 라우트 없음

    h2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.91.2.10/24 dev eth1
        - ip route add default via 10.91.2.1
        - 'bash -c "cd /tmp && echo cp1-ok > index.html && nohup python3 -m http.server 80 >/dev/null 2>&1 &"'

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "h2:eth1"]
