# 15장 - ICMP 차단의 대가 실습 토폴로지
#
#   h1 ──── fw ──── srv(:80 웹)
#  10.15.1.10   10.15.2.10
#
# ★ 고장이 기본값: fw가 "보안 정책"으로 ICMP를 전면 차단한다.
#   서비스(:80)는 멀쩡히 살아 있다 — 그런데 ping은 죽는다. 오판의 시작.
#   수정: 전면 차단 대신 "필수 타입만 선별 허용" (fix.sh)

name: 15-icmp-blocked

mgmt:
  network: clab-mgmt
  ipv4-subnet: 10.99.99.0/24

topology:
  nodes:
    h1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.15.1.10/24 dev eth1
        - ip route add default via 10.15.1.1

    fw:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - sysctl -w net.ipv4.ip_forward=1
        - ip link set eth1 up
        - ip addr add 10.15.1.1/24 dev eth1
        - ip link set eth2 up
        - ip addr add 10.15.2.1/24 dev eth2
        # ★ 고장: "보안상 ICMP는 다 막으세요" — 흔하고 해로운 정책
        - nft add table ip fw
        - 'nft add chain ip fw forward { type filter hook forward priority 0 ; }'
        - nft add rule ip fw forward ip protocol icmp drop

    srv:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.15.2.10/24 dev eth1
        - ip route add default via 10.15.2.1
        - 'bash -c "cd /tmp && echo alive > index.html && nohup python3 -m http.server 80 >/dev/null 2>&1 &"'

  links:
    - endpoints: ["h1:eth1", "fw:eth1"]
    - endpoints: ["fw:eth2", "srv:eth1"]
