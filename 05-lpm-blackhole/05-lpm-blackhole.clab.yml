# 05장 - Longest Prefix Match & 블랙홀 실습 토폴로지
#
#   h1 ──── r1 ──── h2(.10 + secondary .11)
#  10.5.1.10   10.5.2.0/24
#
# ★ 고장이 기본값: r1에 "blackhole 10.5.2.10/32" — h2의 주 IP만 정확히 저격.
#   /24(연결된 경로)보다 /32가 더 구체적이므로 LPM에 의해 /32가 이긴다.
#   증상: 10.5.2.11은 되는데 10.5.2.10만 조용히 타임아웃.
#   수정(한 줄): docker exec clab-05-lpm-blackhole-r1 ip route del blackhole 10.5.2.10/32

name: 05-lpm-blackhole

mgmt:
  network: clab-mgmt
  ipv4-subnet: 10.99.99.0/24

topology:
  nodes:
    h1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.5.1.10/24 dev eth1
        - ip route add default via 10.5.1.1

    r1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - sysctl -w net.ipv4.ip_forward=1
        - ip link set eth1 up
        - ip addr add 10.5.1.1/24 dev eth1
        - ip link set eth2 up
        - ip addr add 10.5.2.1/24 dev eth2
        - ip route add blackhole 10.5.2.10/32      # ★ 의도적 고장: h2 주 IP만 저격

    h2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - 'bash -c "ip route del default 2>/dev/null || true"'
        - ip link set eth1 up
        - ip addr add 10.5.2.10/24 dev eth1
        - ip addr add 10.5.2.11/24 dev eth1        # secondary — "옆 IP" 대조군
        - ip route add default via 10.5.2.1

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "h2:eth1"]
